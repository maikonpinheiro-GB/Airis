<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIris</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#2563eb', 
                            dark: '#09090b', 
                            card: '#18181b', 
                            border: '#27272a' 
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #09090b; color: #f4f4f5; }
        
        .bento-card {
            background-color: rgba(24, 24, 27, 0.7);
            border: 1px solid #27272a;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) { background-color: #1d4ed8; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background-color: #27272a;
            color: #e4e4e7;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover:not(:disabled) { background-color: #3f3f46; }

        .saas-input {
            background-color: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 10px;
            color: #f4f4f5;
            transition: all 0.2s;
        }
        .saas-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(37,99,235, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(37,99,235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37,99,235, 0); }
        }
        .animate-calling { animation: pulse-ring 2s infinite; border-color: #2563eb; }

        .chat-bubble-ai { background-color: #27272a; border-radius: 12px 12px 12px 2px; }
        .chat-bubble-client { background-color: #2563eb; border-radius: 12px 12px 2px 12px; }
        
        .placeholder-watermark::placeholder {
            color: #52525b; 
            font-weight: 500;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">

    <header class="bg-brand-dark/90 backdrop-blur-md border-b border-brand-border sticky top-0 z-50">
        <div class="max-w-[1800px] mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-robot text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight text-white">AIris</h1>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-wider font-medium">idealizado por Maikon Nattan</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-brand-card border border-brand-border rounded-xl px-3 py-1.5">
                    <i class="fa-solid fa-key text-zinc-500 text-xs"></i>
                    <input type="password" id="api-key-input" placeholder="Cole sua Chave API do Gemini" class="bg-transparent border-none text-xs text-white focus:outline-none w-48 placeholder-zinc-600" onchange="salvarChaveAPI()">
                </div>

                <div id="usb-status" class="hidden items-center gap-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl">
                    <i class="fa-solid fa-link text-emerald-400 text-xs"></i>
                    <span class="text-xs font-semibold text-emerald-400">Telefone Conectado</span>
                </div>
                
                <button id="btn-conectar" onclick="conectarUSB()" class="btn-primary px-5 py-2 text-xs flex items-center gap-2 shadow-lg shadow-blue-500/20">
                    <i class="fa-brands fa-usb text-lg"></i> Conectar Celular
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[1800px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Painel Esquerdo: Roteiro e Base de Dados -->
        <div class="lg:col-span-3 flex flex-col gap-6">
            
            <div class="bento-card p-5 flex flex-col min-h-[250px]">
                <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-brand-blue"></i> Roteiro
                </h2>
                
                <textarea id="ai-prompt" rows="5" class="w-full saas-input p-3 text-xs text-zinc-300 resize-none flex-1 mb-4" placeholder="Ex: Ligue para avisar sobre o novo ciclo e direcione para o aplicativo se houver interesse."></textarea>

                <div class="border-t border-zinc-800 pt-4">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-zinc-400 uppercase">Base de Conhecimento</label>
                        <span class="text-[9px] text-zinc-600 bg-zinc-800 px-2 py-0.5 rounded">Max 5MB</span>
                    </div>
                    <p class="text-[10px] text-zinc-500 mb-3">Anexe PDF, imagens ou textos de apoio.</p>
                    
                    <div class="flex flex-wrap gap-2 mb-3" id="attachments-list"></div>
                    
                    <button onclick="document.getElementById('knowledge-input').click()" class="btn-secondary py-2 px-3 text-xs w-full flex items-center justify-center gap-2 mb-3">
                        <i class="fa-solid fa-paperclip"></i> Anexar Arquivo
                    </button>
                    <input type="file" id="knowledge-input" multiple accept="image/*,audio/*,application/pdf,text/plain" class="hidden" onchange="processarAnexos(event)">
                    
                    <button onclick="validarRoteiro()" class="btn-primary py-2 px-3 text-xs w-full flex items-center justify-center gap-2 border border-brand-blue/30">
                        Validar Roteiro
                    </button>
                </div>
            </div>

            <div class="bento-card p-5">
                <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-file-import text-brand-blue"></i> Importar Dados
                </h2>
                <textarea id="paste-area" rows="6" class="w-full saas-input p-3 text-xs text-zinc-300 resize-none mb-3 placeholder-watermark" placeholder="Copie no VDI os dados (Código RE, Nome e telefone), cole aqui dentro e clique em processar."></textarea>
                <button onclick="processarEntradas()" class="btn-primary w-full py-2 text-xs">Processar VDI</button>
            </div>
        </div>

        <!-- Painel Central: Palco de Discagem e Conversa -->
        <div class="lg:col-span-6 flex flex-col gap-6">
            <div class="bento-card p-8 flex flex-col items-center relative min-h-[600px] shadow-2xl shadow-black/50 overflow-hidden" id="stage-container">
                
                <div class="absolute top-6 left-0 w-full flex justify-center z-20">
                    <span id="stage-badge" class="px-4 py-1.5 rounded-full bg-zinc-800/80 backdrop-blur border border-zinc-700 text-[10px] font-semibold text-zinc-300 tracking-widest uppercase">
                        Sistema Aguardando
                    </span>
                </div>

                <div id="dialer-view" class="flex flex-col items-center justify-center w-full mt-12 transition-opacity duration-300">
                    <h2 id="stage-name" class="text-3xl font-bold text-white mb-2 truncate max-w-full text-center">---</h2>
                    <p id="stage-code" class="text-xs font-mono text-brand-blue bg-blue-500/10 px-2 py-1 rounded border border-blue-500/20 mb-3">CÓD: ---</p>
                    <p id="stage-phone" class="text-2xl font-light text-zinc-300 mb-8 tracking-widest">---</p>

                    <div id="timer-container" class="hidden flex-col items-center justify-center mb-8 w-full max-w-sm">
                        <p class="text-[10px] font-semibold text-zinc-500 uppercase tracking-widest mb-2" id="timer-label">Chamando...</p>
                        <div class="text-5xl font-light tabular-nums text-white mb-4" id="stage-timer">00</div>
                        <div class="w-full bg-zinc-800 rounded-full h-1 overflow-hidden">
                            <div id="timer-bar" class="bg-brand-blue h-full w-full transition-all duration-1000 ease-linear"></div>
                        </div>
                    </div>

                    <div id="main-controls" class="w-full max-w-md mt-auto">
                        <button id="btn-iniciar" onclick="iniciarCampanha()" class="btn-primary w-full py-4 text-sm flex items-center justify-center gap-3 uppercase tracking-wider opacity-50 cursor-not-allowed" disabled>
                            <i class="fa-solid fa-play"></i> Iniciar Automação
                        </button>
                        
                        <div id="active-controls" class="hidden grid grid-cols-2 gap-3 mt-4">
                            <button id="btn-pausar" onclick="pausarCampanha()" class="btn-secondary py-3 text-xs flex items-center justify-center gap-2">
                                <i class="fa-solid fa-pause"></i> Pausar
                            </button>
                            <button id="btn-pular" onclick="desligarEPular()" class="bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl py-3 text-xs font-semibold hover:bg-red-500/20 transition-colors flex items-center justify-center gap-2">
                                <i class="fa-solid fa-forward-step"></i> Pular
                            </button>
                        </div>
                    </div>

                    <button id="btn-atendeu" onclick="marcarAtendido()" class="hidden btn-primary mt-6 w-full max-w-md py-5 flex-col items-center justify-center gap-1 uppercase tracking-wider shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:scale-[1.02]">
                        <span class="flex items-center gap-3 font-bold"><i class="fa-solid fa-phone-volume animate-bounce"></i> Cliente Atendeu</span>
                        <span class="text-[9px] text-white/70 normal-case font-normal">(Ativa a IA e o Viva-Voz)</span>
                    </button>
                </div>

                <div id="ai-conversation-view" class="hidden flex-col w-full h-full mt-8 opacity-0 transition-opacity duration-300 flex-1">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-brand-blue/20 flex items-center justify-center">
                                <i class="fa-solid fa-robot text-brand-blue"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-white">IA Conversando</p>
                                <p id="ai-status-text" class="text-[10px] text-emerald-400 font-medium flex items-center gap-1"><i class="fa-solid fa-circle text-[8px] animate-pulse"></i> Ouvindo...</p>
                            </div>
                        </div>
                        <button onclick="desligarLigacaoFisicaEVoltar()" class="text-red-400 hover:text-red-300 text-xs font-medium bg-red-400/10 px-3 py-1.5 rounded-lg border border-red-400/20">
                            Forçar Desligamento
                        </button>
                    </div>

                    <div id="chat-log" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 text-sm flex flex-col"></div>

                    <div class="grid grid-cols-2 gap-3 pt-4 border-t border-zinc-800 mt-auto">
                        <button onclick="tabulaChamada('Venda Realizada')" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-emerald-500/20 transition-colors">
                            <i class="fa-solid fa-handshake text-lg"></i> <span class="text-[10px] uppercase font-bold">Venda</span>
                        </button>
                        <button onclick="tabulaChamada('Retorno Solicitado')" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-amber-500/20 transition-colors">
                            <i class="fa-solid fa-clock-rotate-left text-lg"></i> <span class="text-[10px] uppercase font-bold">Retorno</span>
                        </button>
                        <button onclick="tabulaChamada('Sem Interesse')" class="bg-zinc-800 text-zinc-300 border border-zinc-700 rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                            <i class="fa-solid fa-user-xmark text-lg"></i> <span class="text-[10px] uppercase font-bold">Sem Interesse</span>
                        </button>
                        <button onclick="tabulaChamada('Queda de Ligação')" class="bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-red-500/20 transition-colors">
                            <i class="fa-solid fa-phone-slash text-lg"></i> <span class="text-[10px] uppercase font-bold">Queda</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Painel Direito: Fila e Relatório -->
        <div class="lg:col-span-3 flex flex-col gap-6">
            <div class="bento-card p-5 flex-1 flex flex-col min-h-[250px]">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800">
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Fila</h2>
                    <span id="stat-total" class="bg-brand-blue text-white px-2 py-0.5 rounded text-[10px] font-bold">0</span>
                </div>
                <div id="queue-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <p class="text-[10px] text-zinc-600 text-center mt-4">Nenhum contato na fila.</p>
                </div>
            </div>
            
            <div class="bento-card p-5 flex-1 flex flex-col min-h-[250px]">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800">
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Histórico</h2>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <p class="text-[10px] text-zinc-600 text-center mt-4">Nenhum atendimento realizado.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        const CORE_PROMPT = `PROMPT PRINCIPAL — ASSISTENTE VIRTUAL DA CENTRAL DE VENDAS GRUPO BOTICÁRIO
Você é o assistente virtual da Central de Vendas do Grupo Boticário.
Sua função é conversar com revendedoras de forma extremamente natural, humana, amigável, simples e persuasiva, criando conexão e conduzindo a revendedora para uma ação comercial.
Você NÃO realiza pedidos, NÃO monta pedidos, NÃO finaliza compras e NÃO deve se apresentar como alguém que consegue realizar essas ações.
Seu objetivo é estimular a revendedora a continuar o processo de compra pelos canais oficiais disponíveis, principalmente:
Aplicativo Revendedor Grupo Boticário;
Espaço do Revendedor;
Assistente;
Consultor(a);
Supervisor(a).
A conversa deve fazer a revendedora sentir que está falando com alguém que realmente entende sua rotina, sem parecer um robô, vendedor automático ou texto produzido por IA.
ESTILO DE COMUNICAÇÃO
Fale de forma extremamente natural.
Seja amigável, direta e persuasiva.
Use linguagem simples e fácil de entender.
Crie rapport de maneira natural, sem exagerar em elogios, intimidade ou frases artificiais.
Não tente parecer “amigo íntimo” da revendedora.
Não use linguagem técnica de vendas.
Não infantilize a revendedora.
Não escreva textos longos.
Responda com no máximo 2 frases por mensagem.
Não use asteriscos.
Não use emojis.
Não use formatação.
Não faça textos com aparência de propaganda automática.
Não repita a mesma frase várias vezes.
Não faça perguntas desnecessárias.
Não transforme toda conversa em uma sequência de perguntas.
Adapte a resposta ao que a revendedora acabou de falar.
PRINCÍPIO CENTRAL
Seu trabalho não é convencer a qualquer custo.
Seu trabalho é descobrir o que está impedindo ou estimulando a revendedora a comprar e conduzi-la naturalmente para o próximo passo.
Nunca pressione excessivamente.
Nunca discuta.
Nunca confronte.
Nunca tente vencer uma objeção à força.
Nunca invente informações.
Nunca invente promoções, preços, descontos, prazos, produtos, condições comerciais ou benefícios.
Quando não tiver informação suficiente, seja transparente.
Quando a revendedora demonstrar interesse, facilite o caminho para ela comprar.
Quando demonstrar resistência, descubra primeiro o motivo.
Quando não houver interesse, respeite a decisão.
METODOLOGIA INTERNA DE VENDAS
Utilize internamente os princípios de SPIN Selling, MEDDIC, SNAP Selling e Sistema Sandler.
Nunca mencione o nome dessas metodologias para a revendedora.
SPIN SELLING
Use perguntas de Situação para entender rapidamente o contexto.
Use perguntas de Problema para identificar dificuldades ou oportunidades.
Use Implicação para mostrar de maneira natural o impacto de deixar uma oportunidade passar.
Use Necessidade de solução para conduzir a revendedora a perceber que vale a pena agir.
Não faça todas as etapas obrigatoriamente.
Use somente a etapa necessária para aquele momento da conversa.
MEDDIC ADAPTADO
Identifique internamente:
Qual é o objetivo da revendedora.
Qual é a dificuldade principal.
O que influencia sua decisão de compra.
Como ela costuma realizar seus pedidos.
Quem participa da decisão, quando aplicável.
Qual benefício pode tornar a ação mais interessante.
Não faça uma entrevista.
Essas informações devem ser obtidas naturalmente durante a conversa.
SNAP SELLING
Sempre procure tornar a próxima ação simples.
Evite excesso de informação.
Mostre o benefício de forma clara.
Conecte a sugestão ao momento da revendedora.
Crie senso de prioridade somente quando existir um motivo real.
O objetivo é reduzir o esforço necessário para a revendedora agir.
SISTEMA SANDLER
Não pressione.
Não implore pela compra.
Não discuta objeções.
Não tente “quebrar” a resistência da revendedora.
Quando houver uma objeção, procure entender o motivo real.
Faça perguntas curtas quando necessário.
Crie pequenos compromissos.
Respeite quando a revendedora realmente não quiser comprar.
OBJETIVO DA CONVERSA
A conversa deve conduzir, quando houver oportunidade, para uma destas ações:
“Confere no Aplicativo Revendedor.”
“Dá uma olhada nas ofertas disponíveis no aplicativo.”
“Você pode verificar isso no Espaço do Revendedor.”
“Vale falar com seu consultor(a).”
“Seu supervisor(a) consegue te orientar.”
“Você pode consultar o assistente disponível para fazer o pedido.”
Evite repetir sempre a mesma chamada para ação.
Escolha o canal de acordo com o contexto da conversa.
SE A REVENDEDORA ESTIVER INTERESSADA
Aumente o nível de direcionamento.
Exemplo de raciocínio:
Interesse → benefício → próximo passo.
Não fique prolongando a conversa quando a pessoa já demonstrou intenção.
SE A REVENDEDORA ESTIVER INDECISA
Descubra o que está impedindo a decisão.
Exemplo:
“Você está em dúvida pela oferta ou porque ainda não sabe o que comprar?”
Depois adapte a conversa à resposta.
SE A REVENDEDORA DISSER QUE ESTÁ SEM DINHEIRO
Não pressione.
Descubra se o problema é:
falta de dinheiro;
falta de necessidade;
medo de ficar com estoque parado;
falta de clientes;
valor da compra;
momento financeiro;
ou outro motivo.
Depois conduza somente se existir uma alternativa real.
SE A REVENDEDORA DISSER QUE NÃO PRECISA COMPRAR
Não tente contradizê-la imediatamente.
Procure entender se ela realmente não precisa repor produtos ou se simplesmente ainda não viu as oportunidades do ciclo.
Exemplo:
“Entendi. Você está sem necessidade de reposição agora ou ainda não conseguiu olhar as ofertas do ciclo?”
SE A REVENDEDORA ESTIVER COM PRESSA
Seja ainda mais objetiva.
Não faça perguntas longas.
Priorize uma única ação.
SE A REVENDEDORA PEDIR PARA VOCÊ FAZER O PEDIDO
Explique de maneira simples que você não realiza pedidos e direcione para o canal adequado.
Exemplo:
“Eu não consigo finalizar o pedido por aqui, mas você consegue fazer pelo Aplicativo Revendedor ou falar com seu consultor.”
GRUPO BOTICÁRIO
O universo principal da conversa deve estar relacionado às marcas comercializadas pelas revendedoras no contexto informado pela empresa:
O Boticário;
O.U.I;
Au.Migos;
Quem Disse, Berenice?;
Eudora.
Fale sobre as marcas somente quando fizer sentido para a conversa.
Nunca invente características, preços, descontos, disponibilidade ou campanhas.
Quando mencionar produtos, promoções ou condições específicas, utilize somente informações que estejam disponíveis no contexto fornecido pelo sistema.
POSICIONAMENTO
Você não é um simples chatbot.
Você atua como um assistente comercial inteligente que ajuda a revendedora a identificar oportunidades e tomar o próximo passo.
Seu foco é:
gerar interesse;
criar conexão;
entender a necessidade;
reduzir objeções;
facilitar a decisão;
estimular a ação;
e direcionar para o canal oficial de compra.
REGRA DE NATURALIDADE
Nunca escreva como um roteiro de telemarketing.
Nunca utilize frases excessivamente comerciais.
Nunca diga coisas como:
“Gostaria de aproveitar nossa maravilhosa oportunidade?”
“Você não pode perder essa incrível promoção!”
“Essa oferta é imperdível!”
Prefira linguagem natural, como:
“Dá uma olhadinha porque pode ter alguma condição boa para você.”
“Vale conferir antes de deixar passar.”
“Você já conseguiu olhar as ofertas desse ciclo?”
“Se estiver pensando em comprar, dá uma conferida no aplicativo.”
“Pode ser uma boa oportunidade para repor o que suas clientes já procuram.”
RAPPORT
Crie rapport observando o estilo da própria revendedora.
Se ela falar de maneira curta, responda curto.
Se ela estiver mais comunicativa, acompanhe naturalmente.
Não force intimidade.
Não invente experiências pessoais.
Não diga que entende sentimentos que você não pode realmente conhecer.
Utilize contexto da conversa para demonstrar atenção.
EXEMPLO DE CONDUTA
Revendedora:
“Esse ciclo estou sem dinheiro.”
Resposta:
“Entendi. É mais uma questão de valor ou você também está sem necessidade de repor produtos?”
Revendedora:
“Estou sem necessidade.”
Resposta:
“Faz sentido. Nesse caso, vale só conferir as ofertas do ciclo antes de decidir, principalmente se aparecer algo que você já costuma vender.”
Revendedora:
“Como faço para comprar?”
Resposta:
“Você consegue fazer pelo Aplicativo Revendedor; se preferir, também pode procurar o Espaço do Revendedor ou falar com seu consultor.”
REGRAS ABSOLUTAS
Máximo de 2 frases por resposta.
Nunca usar asteriscos.
Nunca usar emojis.
Nunca realizar pedidos.
Nunca confirmar pedido.
Nunca prometer disponibilidade.
Nunca inventar informações.

                    return showToast(`Arquivo ${file.name} ignorado (maior que 5MB).`, "error");
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Data = e.target.result.split(',')[1];
                    baseConhecimento.push({
                        inlineData: {
                            data: base64Data,
                            mimeType: file.type
                        },
                        name: file.name
                    });
                    renderizarAnexos();
                };
                reader.readAsDataURL(file);
            });
        }

        function processarEntradas() {
            const rawText = document.getElementById('paste-area').value;
            if(!rawText.trim()) return showToast("Cole dados antes de processar.", "warning");
            
            const linhas = rawText.split('\n');
            let adicionados = 0;

            for (let linha of linhas) {
                let cleanText = linha.trim().replace(/(?:\b|\+)(?:55|0055)\s?/g, '');
                if (!cleanText) continue;
                
                let tokens = cleanText.split(/\s+/);
                if (tokens.length === 0) continue;

                let phone = "";
                let tokensToRemove = 0;
                let tempDigits = "";
                
                for (let i = tokens.length - 1; i >= 0; i--) {
                    let tokenDigits = tokens[i].replace(/\D/g, '');
                    tempDigits = tokenDigits + tempDigits; 
                    if (tempDigits.length >= 10 && tempDigits.length <= 11) {
                        phone = tempDigits;
                        tokensToRemove = tokens.length - i;
                        break;
                    }
                    if (tempDigits.length > 11) break;
                }

                if (!phone && tokens.length > 0) {
                    let lastTokenDigits = tokens[tokens.length - 1].replace(/\D/g, '');
                    if(lastTokenDigits.length >= 10 && lastTokenDigits.length <= 11) {
                        phone = lastTokenDigits;
                        tokensToRemove = 1;
                    }
                }
                if (!phone) continue;

                let remainingTokens = tokens.slice(0, tokens.length - tokensToRemove);
                let code = "S/C";
                let name = "";

                if (remainingTokens.length > 0) {
                    let firstTokenDigits = remainingTokens[0].replace(/\D/g, '');
                    if (firstTokenDigits.length > 0) {
                        code = remainingTokens[0]; 
                        remainingTokens.shift();
                    }
                    if (remainingTokens.length > 0) {
                        name = remainingTokens.join(' ').replace(/[^\w\sÀ-ÿ]/g, '').trim();
                    }
                }
                if(!name) name = "Contato";

                if (phone.length === 10) phone = phone.substring(0, 2) + '9' + phone.substring(2);
                if (phone.length !== 11) continue; 

                contatosBase.push({ name, code, phone, id: Date.now() + Math.random() });
                adicionados++;
            }

            if(adicionados > 0) {
                document.getElementById('paste-area').value = '';
                atualizarInterfaceBase();
                showToast(`${adicionados} contatos adicionados à fila.`, 'success');
            } else {
                showToast("Nenhum formato VDI válido encontrado.", "error");
            }
        }

        function setupVoiceRecognition() {

        function adicionarLogChat(quem, texto) {
            const log = document.getElementById('chat-log');
            const isAI = quem === 'IA';

        function falar(texto) {
            if (!('speechSynthesis' in window)) return pausarReconhecimento(false);
            
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1; 
            
            const voices = speechSynthesis.getVoices();
            const brVoice = voices.find(v => v.lang.includes('pt-BR') && v.name.includes('Google'));
            if(brVoice) utterance.voice = brVoice;

            utterance.onend = () => { pausarReconhecimento(false); };
            
            speechSynthesis.speak(utterance);
        }

        async function chamarGemini() {
            if (!apiKey) return showToast("API Key faltando", "error");
            
            const roteiroEspecifico = document.getElementById('ai-prompt').value.trim();
            const promptFinal = `${CORE_PROMPT}\n\n[INSTRUÇÕES ESPECÍFICAS DESTA CAMPANHA (ROTEIRO)]\n${roteiroEspecifico}`;

            const payload = {
                system_instruction: { parts: [{ text: promptFinal }] },
                contents: chatHistory, 
                generationConfig: {
                    temperature: 0.7, 
                    maxOutputTokens: 150 
                }
            };

            if (baseConhecimento.length > 0 && chatHistory.length > 0) {
                let firstUserIndex = chatHistory.findIndex(m => m.role === 'user');
                if (firstUserIndex !== -1) {
                    const originalText = chatHistory[firstUserIndex].parts[0].text;
                    chatHistory[firstUserIndex].parts = [
                        ...baseConhecimento,
                        { text: originalText }
                    ];
                }
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Erro na API do Gemini");
                
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const respostaIA = data.candidates[0].content.parts[0].text;
                
                if (baseConhecimento.length > 0) {
                     let firstUserIndex = chatHistory.findIndex(m => m.role === 'user');
                     if (firstUserIndex !== -1) {
                         const txt = chatHistory[firstUserIndex].parts.find(p => p.text).text;
                         chatHistory[firstUserIndex].parts = [{ text: txt }];
                     }
                }

                adicionarLogChat('IA', respostaIA);
                chatHistory.push({ role: 'model', parts: [{ text: respostaIA }] });
                
                falar(respostaIA);

            } catch (error) {
                console.error("Detalhe do Erro do Gemini:", error);
                let fallback = "Acho que a ligação falhou um pouco. Pode repetir, por favor?";
                adicionarLogChat('IA', fallback);
                chatHistory.push({ role: 'model', parts: [{ text: fallback }] });
                falar(fallback);
            }
        }

        async function getAdbKeyPair() { 
            return await crypto.subtle.generateKey({ name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["sign", "verify"]); 
        }
        async function signAdbToken(keyPair, token) { 
            const signature = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", keyPair.privateKey, token); 
            return new Uint8Array(signature); 
        }
        async function getAdbPublicKeyPayload(keyPair) {
            const exp = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
            const str = atob(exp.n.replace(/-/g, '+').replace(/_/g, '/'));
            const mod = new Uint8Array(str.length);
            for (let i = 0; i < str.length; i++) mod[i] = str.charCodeAt(i);
            
            let n = 0n; for (let i = 0; i < mod.length; i++) n = (n << 8n) | BigInt(mod[i]);
            const r32 = 1n << 32n, n0 = n % r32;
            let inv = 1n; for (let i = 0; i < 32; i++) inv = (inv * (2n - n0 * inv)) % r32;
            
            const buf = new ArrayBuffer(524), view = new DataView(buf), bytes = new Uint8Array(buf);
            view.setUint32(0, 64, true); view.setUint32(4, Number((r32 - inv) % r32), true);
            let tN = n; for (let i = 0; i < 256; i++) { bytes[8 + i] = Number(tN & 0xffn); tN >>= 8n; }
            let tRR = ((1n << 2048n) * (1n << 2048n)) % n; for (let i = 0; i < 256; i++) { bytes[264 + i] = Number(tRR & 0xffn); tRR >>= 8n; }
            view.setUint32(520, 65537, true);
            
            const nm = new TextEncoder().encode("BaraAI_Host\0");
            const full = new Uint8Array(buf.byteLength + nm.length);
            full.set(bytes, 0); full.set(nm, buf.byteLength); 
            return full;
        }

        async function sendPkt(cmd, arg0, arg1, data = new Uint8Array(0)) {
            if (!usbDevice || !epOut) return;
            const hdr = new ArrayBuffer(24), vw = new DataView(hdr);
            let ck = 0; for (let i = 0; i < data.length; i++) ck = (ck + data[i]) & 0xffffffff;
            vw.setUint32(0, cmd, true); vw.setUint32(4, arg0, true); vw.setUint32(8, arg1, true);
            vw.setUint32(12, data.length, true); vw.setUint32(16, ck, true); vw.setUint32(20, (cmd ^ 0xffffffff) >>> 0, true);
            const b = new Uint8Array(24 + data.length); b.set(new Uint8Array(hdr), 0); b.set(data, 24);
            await usbDevice.transferOut(epOut, b);
        }
        
        async function readPkt() {
            if (!usbDevice || !epIn) return null;
            try {
                const res = await usbDevice.transferIn(epIn, 24);
                if (!res.data || res.data.byteLength < 24) return null;
                const vw = new DataView(res.data.buffer);
                const cmd = vw.getUint32(0, true), arg0 = vw.getUint32(4, true), arg1 = vw.getUint32(8, true), len = vw.getUint32(12, true);
                let pay = new Uint8Array(0);
                if (len > 0) { const dRes = await usbDevice.transferIn(epIn, len); if (dRes.data) pay = new Uint8Array(dRes.data.buffer); }
                return { cmd, arg0, arg1, data: pay };
            } catch (e) { return { error: true, msg: e.message }; }
        }

        async function conectarUSB() {
            try {
                usbDevice = await navigator.usb.requestDevice({ filters: [{ classCode: 255, subclassCode: 66, protocolCode: 1 }] });
                await usbDevice.open();
                if (usbDevice.configuration === null) await usbDevice.selectConfiguration(1);
                
                let intfNum = -1;
                for (const c of usbDevice.configurations) for (const i of c.interfaces) for (const a of i.alternates)
                    if (a.interfaceClass === 255 && a.interfaceSubclass === 66 && a.interfaceProtocol === 1) { intfNum = i.interfaceNumber; epIn = a.endpoints.find(e => e.direction === 'in').endpointNumber; epOut = a.endpoints.find(e => e.direction === 'out').endpointNumber; break; }
                
                await usbDevice.claimInterface(intfNum);
                await sendPkt(0x4E584E43, 0x01000000, 4096, new TextEncoder().encode("host::BaraAI\0"));
                
                let kp = await getAdbKeyPair();
                let r = await readPkt();
                
                if (r && r.cmd === 0x4E584E43) isAdbReady = true;
                else if (r && r.cmd === 0x48545541 && r.arg0 === 1) {
                    await sendPkt(0x48545541, 2, 0, await signAdbToken(kp, r.data));
                    let r2 = await readPkt();
                    if (r2 && r2.cmd === 0x4E584E43) isAdbReady = true;
                    else {
                        await sendPkt(0x48545541, 3, 0, await getAdbPublicKeyPayload(kp));
                        showToast("OLHE O CELULAR e Permita a Depuração USB!", "warning");
                        while(!isAdbReady) { let wr = await readPkt(); if(wr && wr.cmd === 0x4E584E43) isAdbReady = true; if(wr && wr.error) throw new Error("Cabo solto"); }
                    }
                }
                
                if (isAdbReady) {
                    document.getElementById('btn-conectar').style.display = 'none';
                    document.getElementById('usb-status').classList.remove('hidden'); 
                    document.getElementById('usb-status').classList.add('flex');
                    
                    const btnIniciar = document.getElementById('btn-iniciar');
                    btnIniciar.disabled = false;
                    btnIniciar.classList.remove('opacity-50', 'cursor-not-allowed');

                    await runAdbShell("settings put system screen_off_timeout 2147483647");
                    await runAdbShell("settings put global stay_on_while_plugged_in 3");
                    await runAdbShell("input keyevent 224");
                    showToast("Celular Conectado. Automação Pronta.", "success");
                }
            } catch (e) { 
                showToast("Erro USB. Depuração ativada?", "error"); 
            }
        }
        
        async function runAdbShell(cmd) {
            if (!isAdbReady) return false;
            try {
                const id = localIdCounter++;
                await sendPkt(0x4E45504F, id, 0, new TextEncoder().encode("shell:" + cmd + "\0"));
                let ok = false;
                for(let i=0; i<4; i++) {
                    let r = await readPkt(); if(r && r.error) return false;
                    if(r && r.cmd === 0x59414B4F && r.arg1 === id) ok = true;
                    if(r && r.cmd === 0x45534C43) { await sendPkt(0x45534C43, id, r.arg0); break; }
                }
                return true;
            } catch(e) { return false; }
        }
    </script>
